<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatSpace · Answer a question to continue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    background: #000;
    color: rgb(255 255 255 / 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    width: 100%;
    max-width: 448px;
    padding: 32px;
    border-radius: 35px;
    border: 1px solid rgb(255 255 255 / 0.15);
    background: rgb(0 0 0 / 0.7);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    backdrop-filter: blur(10px) saturate(150%);
    box-shadow:
      inset 0 0 1px 1px rgb(255 255 255 / 0.12),
      inset 0 0 10px 2px rgb(255 255 255 / 0.05),
      0 8px 24px rgb(0 0 0 / 0.35);
    animation: enter 180ms ease-out both;
  }
  @keyframes enter {
    from { opacity: 0; margin-top: -8px; }
    to { opacity: 1; margin-top: 0; }
  }
  .badge {
    width: 48px; height: 48px;
    border-radius: 9999px;
    background: rgb(255 255 255 / 0.1);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .badge svg { width: 22px; height: 22px; stroke: rgb(255 255 255 / 0.55); }
  h1 { font-size: 18px; font-weight: 500; color: #fff; }
  .desc { margin-top: 8px; font-size: 14px; line-height: 1.65; color: rgb(255 255 255 / 0.55); }
  form { margin-top: 24px; }
  label { display: block; font-size: 14px; color: rgb(255 255 255 / 0.9); }
  input {
    margin-top: 8px;
    width: 100%;
    padding: 8px 12px;
    font-size: 16px;
    font-family: inherit;
    color: rgb(255 255 255 / 0.9);
    border-radius: 12px;
    border: 1px solid rgb(255 255 255 / 0.1);
    background: rgb(255 255 255 / 0.05);
    outline: none;
  }
  input:focus { border-color: rgb(255 255 255 / 0.15); }
  input::placeholder { color: rgb(255 255 255 / 0.35); }
  .error { margin-top: 8px; font-size: 12px; color: #ff3045; }
  button {
    margin-top: 16px;
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: #000;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .unlocked { text-align: center; }
  .unlocked h1 { margin-top: 16px; }
  .unlocked .check {
    width: 56px; height: 56px;
    margin: 0 auto;
    border-radius: 9999px;
    background: rgb(255 255 255 / 0.1);
    display: flex; align-items: center; justify-content: center;
  }
  .unlocked .check svg { width: 26px; height: 26px; stroke: #fff; }
</style>
</head>
<body>
  <div class="panel" id="gate">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10V8a5 5 0 0 1 9.4-2.4"/><path d="M3.5 11.5h17a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-17a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z"/>
      </svg>
    </div>
    <h1>进入前请回答一个问题</h1>
    <p class="desc">为了防止 API token 浪费，本产品仅限知道答案的人访问。回答正确即可进入，同一浏览器只需回答一次。</p>
    <form id="form">
      <label for="answer">这个网站是哪个比赛的作品？</label>
      <input id="answer" type="text" autocomplete="off" autofocus placeholder="请输入比赛名称" />
      <p class="error" id="error" hidden role="alert">答案不对，请再试一次。</p>
      <button type="submit" id="submit" disabled>进入</button>
    </form>
  </div>
  <script>
    var KEY = "chatspace.accessGate:v1";
    var ANSWER = "tripothon";
    var input = document.getElementById("answer");
    var error = document.getElementById("error");
    var submit = document.getElementById("submit");

    function passed() {
      try { return localStorage.getItem(KEY) === "ok"; } catch (e) { return false; }
    }

    input.addEventListener("input", function () {
      submit.disabled = input.value.trim().length === 0;
      if (!error.hidden) error.hidden = true;
    });

    document.getElementById("form").addEventListener("submit", function (event) {
      event.preventDefault();
      if (input.value.trim().toLowerCase() !== ANSWER) {
        error.hidden = false;
        return;
      }
      try { localStorage.setItem(KEY, "ok"); } catch (e) {}
      unlock();
    });

    function unlock() {
      document.getElementById("gate").innerHTML =
        '<div class="unlocked">' +
          '<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 10 18 20 6"/></svg></div>' +
          "<h1>已解锁</h1>" +
          '<p class="desc">这是门禁页预览。门禁已集成进 ChatSpace 前端代码，随网站一起部署：答对一次后同一浏览器不再拦截。</p>' +
        "</div>";
    }

    if (passed()) unlock();
  </script>
</body>
</html>
